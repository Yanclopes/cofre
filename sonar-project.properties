# Configuração da análise SonarCloud (estágio Seguranca / SonarCloud da pipeline).
# sonar.organization e sonar.projectKey vêm das variáveis do CodeBuild (Terraform: sonar_organization, sonar_project_key).
sonar.projectName=cofre
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src,infra,deploy,pipeline
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts,infra/.terraform/**

sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json
