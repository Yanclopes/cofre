# SAST complementar com SonarCloud (SonarQube em nuvem), em paralelo ao Semgrep.
# Bloqueia a pipeline se houver vulnerabilidade aberta de severidade BLOCKER ou CRITICAL.
# O token vem do SSM Parameter Store (SecureString, chave KMS ops); nunca fica no repositório.
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - bash pipeline/buildspecs/install-sonar-scanner.sh
  build:
    commands:
      - >
        sonar-scanner
        -Dsonar.host.url=https://sonarcloud.io
        -Dsonar.organization="$SONAR_ORGANIZATION"
        -Dsonar.projectKey="$SONAR_PROJECT_KEY"
        -Dsonar.projectVersion="${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}"
      - bash pipeline/buildspecs/sonar-gate.sh
